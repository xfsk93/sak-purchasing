<style>
/* Layout idea: a quiet operations console. Right-hand rail (RTL) for the six areas, dense tables in the middle,
   status carried by coloured stripes and pills so the eye lands on what needs action. */
:root {
  --bg: #f2f4f9;
  --surface: #ffffff;
  --sunken: #e8ecf4;
  --ink: #111a2c;
  --muted: #5a657a;
  --line: #d7ddea;
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e3ebff;
  --crit: #b3261e;   --crit-bg: #fbe6e3;
  --urg: #b85c00;    --urg-bg: #fdecd6;
  --next: #1f5fa8;   --next-bg: #e0ecfa;
  --mon: #0f766e;    --mon-bg: #d9f1ed;
  --idle: #56625f;   --idle-bg: #e6eae8;
  --hold: #6b3fa0;   --hold-bg: #ece3f7;
  --red: #8a4b12;    --red-bg: #f3e6d6;
  --none: #6f6f6f;   --none-bg: #ececec;
  --ok: #1c7a3d;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --shadow: 0 1px 2px rgba(20, 33, 31, .06), 0 8px 24px rgba(20, 33, 31, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c111f; --surface: #151c2e; --sunken: #101727; --ink: #e7ecf7; --muted: #9aa6bd; --line: #273149;
    --accent: #7ea6ff; --accent-ink: #0a1330; --accent-soft: #1b2a52;
    --crit: #ff8a80; --crit-bg: #3d1a17; --urg: #ffb061; --urg-bg: #3b2812; --next: #8dbcf5; --next-bg: #17293f;
    --mon: #62d6c7; --mon-bg: #12332f; --idle: #a9b7b3; --idle-bg: #232f2d; --hold: #c6a4f2; --hold-bg: #2b2140;
    --red: #e0b07a; --red-bg: #33271a; --none: #a5a5a5; --none-bg: #2a2a2a; --ok: #6fd38f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c111f; --surface: #151c2e; --sunken: #101727; --ink: #e7ecf7; --muted: #9aa6bd; --line: #273149;
  --accent: #7ea6ff; --accent-ink: #0a1330; --accent-soft: #1b2a52;
  --crit: #ff8a80; --crit-bg: #3d1a17; --urg: #ffb061; --urg-bg: #3b2812; --next: #8dbcf5; --next-bg: #17293f;
  --mon: #62d6c7; --mon-bg: #12332f; --idle: #a9b7b3; --idle-bg: #232f2d; --hold: #c6a4f2; --hold-bg: #2b2140;
  --red: #e0b07a; --red-bg: #33271a; --none: #a5a5a5; --none-bg: #2a2a2a; --ok: #6fd38f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 22px; } h2 { font-size: 16px; } h3 { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.ltr { direction: ltr; unicode-bidi: isolate; text-align: start; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

#app { display: flex; flex-direction: column; height: 100%; }
.rail { background: var(--surface); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; overflow-y: auto; }
.brand { padding: 4px 8px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.brand b { font-family: var(--font-display); font-size: 18px; letter-spacing: .5px; display: block; }
.brand span { color: var(--muted); font-size: 12px; }
.rail a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; border-inline-start: 3px solid transparent; }
.rail a:hover { background: var(--sunken); }
.rail a[aria-current="page"] { background: var(--accent-soft); border-inline-start-color: var(--accent); font-weight: 600; }
.rail a .count { font-size: 11px; background: var(--sunken); border-radius: 999px; padding: 0 7px; }
.rail a .count.hot { background: var(--crit-bg); color: var(--crit); font-weight: 600; }
.rail .foot { margin-top: auto; padding: 10px 8px 0; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
main { overflow-y: auto; padding: 20px 24px 48px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.head p { margin: 2px 0 0; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; border-top: 3px solid var(--line); }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-family: var(--font-display); font-size: 26px; font-weight: 600; line-height: 1.2; }
.tile .s { font-size: 12px; color: var(--muted); }
.tile.crit { border-top-color: var(--crit); } .tile.urg { border-top-color: var(--urg); } .tile.acc { border-top-color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
.card > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.card > .body { padding: 14px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 7px 10px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--sunken); position: sticky; top: 0; z-index: 1; }
td.wrap, th.wrap { white-space: normal; min-width: 180px; }
td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
td.n { direction: ltr; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--sunken); }
tfoot td { font-weight: 600; background: var(--sunken); border-bottom: 0; }
td.stripe { border-inline-start: 4px solid var(--c, transparent); }
.item-name { max-width: 260px; overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: start; unicode-bidi: plaintext; }

.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--pb); color: var(--pc); }
.st-0 { --pc: var(--crit); --pb: var(--crit-bg); --c: var(--crit); }
.st-1 { --pc: var(--urg); --pb: var(--urg-bg); --c: var(--urg); }
.st-2 { --pc: var(--next); --pb: var(--next-bg); --c: var(--next); }
.st-3 { --pc: var(--mon); --pb: var(--mon-bg); --c: var(--mon); }
.st-4 { --pc: var(--idle); --pb: var(--idle-bg); --c: var(--idle); }
.st-5 { --pc: var(--hold); --pb: var(--hold-bg); --c: var(--hold); }
.st-6 { --pc: var(--red); --pb: var(--red-bg); --c: var(--red); }
.st-7 { --pc: var(--none); --pb: var(--none-bg); --c: var(--none); }
.tag { display: inline-block; padding: 0 7px; border-radius: 6px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
.tag.warn { color: var(--urg); border-color: var(--urg); } .tag.bad { color: var(--crit); border-color: var(--crit); } .tag.good { color: var(--ok); border-color: var(--ok); }

.bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--sunken); }
.bar i { display: block; background: var(--c); min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-inline-end: 5px; }
.meter { width: 90px; height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
.meter i { display: block; height: 100%; background: var(--accent); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; min-width: 0; width: 100%; }
input[type="number"] { direction: ltr; text-align: end; font-variant-numeric: tabular-nums; }
td input[type="number"] { width: 96px; } td input[type="text"] { width: 150px; } td select { width: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--pb, var(--accent-soft)); color: var(--pc, var(--accent)); border-color: var(--pc, var(--accent)); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px 16px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
.kv div span:first-child { color: var(--muted); }
.note { background: var(--accent-soft); border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; }
.note.warn { background: var(--urg-bg); color: var(--urg); } .note.bad { background: var(--crit-bg); color: var(--crit); }
ul.plain { margin: 0; padding-inline-start: 18px; }

.drawer-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { background: var(--bg); width: min(760px, 100%); height: 100%; overflow-y: auto; padding: 18px 20px 40px; box-shadow: var(--shadow); }
.drawer .head { position: sticky; top: -18px; background: var(--bg); padding: 12px 0; z-index: 2; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.sum-row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.sum-row.total { border-bottom: 0; border-top: 2px solid var(--ink); font-weight: 700; font-size: 16px; padding-top: 8px; margin-top: 4px; }
#toast { position: fixed; inset-block-end: 18px; inset-inline-start: 50%; transform: translateX(50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 9px; z-index: 50; box-shadow: var(--shadow); max-width: 90vw; }
#toast[hidden] { display: none; }
[dir="ltr"] #toast { transform: translateX(-50%); }
.brand .btn { margin-top: 8px; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; }

@media (max-width: 860px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .rail { flex-direction: row; overflow-x: auto; padding: 8px 12px; border-inline-end: 0; border-bottom: 1px solid var(--line); align-items: center; }
  .brand { border: 0; margin: 0; padding: 0 8px; } .brand span { display: none; }
  .rail a { white-space: nowrap; border-inline-start: 0; border-bottom: 3px solid transparent; }
  .rail a[aria-current="page"] { border-bottom-color: var(--accent); }
  .rail .foot { display: none; }
  main { padding: 16px; }
  .split { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .rail a { transition: background .12s, border-color .12s; } }

.rail .grp { font-size: 11px; font-weight: 600; color: var(--muted); padding: 12px 10px 2px; letter-spacing: .3px; }
.rail a .lbl { display: flex; flex-direction: column; min-width: 0; }
.rail a .lbl b { font-weight: 500; }
.rail a[aria-current="page"] .lbl b { font-weight: 700; }
.rail a .lbl small { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.helper { margin-top: 14px; background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; }
.helper:empty { display: none; }
.helper h3 { font-size: 12.5px; margin-bottom: 4px; color: var(--accent); }
.helper ol { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 4px; }
.rail .foot { margin-top: 14px; }
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); border-inline-start: 4px solid var(--c); }
.todo li:last-child { border-bottom: 0; border-end-start-radius: 12px; }
.todo .n { font-family: var(--font-display); font-size: 20px; font-weight: 600; min-width: 44px; text-align: center; color: var(--pc); }
.todo .t { flex: 1; min-width: 0; }
.todo .btn { text-decoration: none; color: var(--ink); }
a.btn { text-decoration: none; color: var(--ink); display: inline-block; }
.btn { padding: 8px 14px; }
th, td { padding: 9px 10px; }
@media (max-width: 860px) { .rail .grp, .rail a .lbl small, .helper { display: none; } .todo li { flex-wrap: wrap; } }

/* ---- v4 shell: top bar, tabs, board, PO page ---- */
.top { display: flex; align-items: center; gap: 18px; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top .brand { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; }
.top .brand b { font-size: 19px; line-height: 1.1; } .top .brand span { font-size: 11.5px; }
.top nav { display: flex; gap: 2px; flex: 1 1 auto; overflow-x: auto; }
.top nav a { padding: 8px 13px; border-radius: 999px; color: var(--muted); text-decoration: none; white-space: nowrap; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.top nav a:hover { background: var(--sunken); color: var(--ink); }
.top nav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.top nav .count { font-size: 11px; background: var(--crit-bg); color: var(--crit); border-radius: 999px; padding: 0 7px; font-weight: 700; }
.top .tools { display: flex; gap: 8px; align-items: center; }
.search { position: relative; }
.search input { width: 250px; border-radius: 999px; padding: 8px 14px; background: var(--sunken); border-color: transparent; }
#gres { position: absolute; inset-inline-end: 0; top: 42px; width: 380px; max-width: 90vw; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 30; padding: 6px; display: flex; flex-direction: column; }
#gres button { text-align: start; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#gres button:hover, #gres button:focus-visible { background: var(--sunken); }
#gres small { display: inline-block; min-width: 62px; color: var(--muted); font-size: 11px; }
main { padding: 22px 28px 56px; flex: 1 1 auto; min-height: 0; }
main > #helper, main > #view { max-width: 1500px; margin-inline: auto; }
#helper { display: flex; align-items: center; gap: 14px; background: var(--accent-soft); border-radius: 12px; padding: 10px 16px; margin-bottom: 16px; font-size: 13px; }
#helper:empty { display: none; }
#helper b { color: var(--accent); white-space: nowrap; }
#helper ol { display: flex; gap: 6px 26px; flex-wrap: wrap; margin: 0; padding-inline-start: 18px; flex: 1; }
.tabs { display: inline-flex; gap: 4px; background: var(--sunken); border-radius: 12px; padding: 4px; margin-bottom: 16px; max-width: 100%; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 16px; border-radius: 9px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.card, .tile { border-radius: 16px; } .card { box-shadow: 0 1px 2px rgba(17,26,44,.04); }
.pipe { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; overflow-x: auto; }
.pipe a { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 1px; position: relative; border-bottom: 3px solid var(--accent); }
.pipe a:hover { border-color: var(--accent); }
.pipe .p0 { border-bottom-color: var(--crit); } .pipe .p1, .pipe .p2 { border-bottom-color: var(--hold); } .pipe .p5 { border-bottom-color: var(--ok); } .pipe .p6 { border-bottom-color: var(--urg); }
.pipe .pn { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.pipe .pt { font-weight: 600; font-size: 13px; } .pipe .ps { font-size: 11.5px; color: var(--muted); }
.board { display: grid; grid-template-columns: repeat(6, minmax(210px, 1fr)); gap: 12px; overflow-x: auto; align-items: start; padding-bottom: 8px; }
.col { background: var(--sunken); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.col > header { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 4px; }
.col .count { background: var(--surface); border-radius: 999px; padding: 0 8px; font-size: 12px; }
.col-empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 18px 6px; }
.po { background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--c); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.po:hover { border-color: var(--accent); border-inline-start-color: var(--c); box-shadow: var(--shadow); }
.po-h { display: flex; justify-content: space-between; align-items: center; gap: 6px; } .po-h b { font-size: 15px; }
.po-s { font-weight: 500; } .po-m { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; color: var(--muted); align-items: center; }
.po .btn { align-self: stretch; margin-top: 4px; }
.po-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.po-title { flex: 1; min-width: 200px; } .po-title p { margin: 0; color: var(--muted); }
.steps { list-style: none; display: flex; margin: 0 0 14px; padding: 0; gap: 4px; overflow-x: auto; }
.steps li { flex: 1 1 0; min-width: 96px; text-align: center; font-size: 12px; padding: 8px 6px; background: var(--sunken); color: var(--muted); border-radius: 8px; white-space: nowrap; }
.steps li.done { background: var(--accent-soft); color: var(--accent); }
.steps li.now { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.next { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px dashed var(--accent); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
.next span { flex: 1; min-width: 200px; }
.sup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.sup { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.sup header { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .sup p { margin: 0; }
.sup footer { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
.kv.one { grid-template-columns: 1fr; gap: 5px; }
.btn.sm.primary { padding: 4px 11px; }
@media (max-width: 860px) { .top { padding: 8px 12px; gap: 8px; } .top nav { order: 3; flex-basis: 100%; } .search input { width: 150px; } main { padding: 14px 12px 40px; } #helper { flex-direction: column; align-items: flex-start; } }

/* ---- v6: sidebar shell with soft panels ---- */

:root[data-theme="light"] { --bg: #dfe2e7; --shell: #f1f2f5; --surface: #ffffff; --sunken: #eceef2; --ink: #16181d; --muted: #6a7180; --line: #e3e6ec; --accent: #2f4fe0; --accent-ink: #ffffff; --accent-soft: #e6ebff; --bar: #3d5bd9; --bar-low: #d9773d; color-scheme: light; }
body { background: var(--bg); padding: 14px; }

.steps li.can:hover, .steps li.can:focus-visible { background: var(--accent-soft); color: var(--accent); }

    isOwner: function () { return Promise.resolve(!!(me && me.is_owner)); },
    can: function () { return Promise.resolve(true); },
    me: function () { return Promise.resolve({ name: (me && me.name) || (session && ((session.user.user_metadata || {}).name || session.user.email.split('@')[0])), email: session && session.user.email }); },
    profiles: function () {
      return sb.rpc('sak_profiles').then(function (r) { var o = {}; (r.data || []).forEach(function (p) { o[p.id] = { name: p.name, email: p.email }; }); return o; });
    },
    access: true,
    backup: true,
    signOut: function () { return sb.auth.signOut().then(function () { location.reload(); }); }
  };

  /* ---------- downloads ---------- */
  var MIME = { html: 'text/html;charset=utf-8', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', csv: 'text/csv;charset=utf-8', json: 'application/json', pdf: 'application/pdf' };
  var downloads = {
    save: function (o) {
      var ext = String(o.filename).split('.').pop().toLowerCase();
      var blob = o.data instanceof Blob ? o.data : new Blob([o.data], { type: o.mimeType || MIME[ext] || 'application/octet-stream' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = o.filename;
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return Promise.resolve({ status: 'saved' });
    }
  };

  /* ---------- sign-in screen ---------- */
  var readyResolve; var ready = new Promise(function (r) { readyResolve = r; });
  window.claude = { use: function (n) { return ready.then(function () { return n === 'db' ? db : n === 'user' ? user : n === 'downloads' ? downloads : null; }); } };

  var css = '#sak-login{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg,#f6f7f9);color:var(--ink,#16181d);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;padding:20px}' +
    '#sak-login .box{width:100%;max-width:380px;background:var(--surface,#fff);border:1px solid var(--line,#e3e6ea);border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.06)}' +
    '#sak-login h1{margin:0 0 4px;font-size:22px}#sak-login p{margin:0 0 18px;color:var(--muted,#6b7280);font-size:14px}' +
    '#sak-login label{display:block;font-size:13px;margin:12px 0 6px;color:var(--muted,#6b7280)}' +
    '#sak-login input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line,#d6dae0);border-radius:10px;font:inherit;background:var(--sunken,#fff);color:inherit}' +
    '#sak-login button.go{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--accent,#1f6f5c);color:var(--accent-ink,#fff);font:inherit;font-weight:600;cursor:pointer}' +
    '#sak-login button.go:disabled{opacity:.6;cursor:default}#sak-login .msg{min-height:20px;margin-top:12px;font-size:13px;color:#b42318}#sak-login .msg.ok{color:#1f6f5c}' +
    '#sak-login .alt{margin-top:14px;text-align:center;font-size:13px}#sak-login .alt a{color:var(--accent,#1f6f5c);cursor:pointer;text-decoration:underline}' +
    '#sak-login .lang{position:absolute;top:16px;inset-inline-end:16px;background:none;border:1px solid var(--line,#d6dae0);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;color:inherit}' +
    '#sak-access .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}#sak-access input{flex:1;min-width:220px;padding:9px 11px;border:1px solid var(--line,#d6dae0);border-radius:9px;font:inherit;background:transparent;color:inherit}' +
    '#sak-access ul{list-style:none;margin:0;padding:0}#sak-access li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line,#eee)}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  var mode = 'in';
  function screen(msg, ok) {
    var el = document.getElementById('sak-login');
    if (!el) { el = document.createElement('div'); el.id = 'sak-login'; document.body.appendChild(el); }
    var up = mode === 'up';
    el.setAttribute('dir', en() ? 'ltr' : 'rtl');
    el.innerHTML = '<button class="lang" type="button" data-l>' + T('English', 'العربية') + '</button><form class="box" autocomplete="on">' +
      '<h1>SAK Purchasing</h1><p>' + (up ? T('أنشئ حسابك أول مرة. يجب أن يكون بريدك مضافاً من مدير النظام.', 'Create your account the first time. Your email must be added by the system owner.') : T('سجّل الدخول ببريدك وكلمة المرور.', 'Sign in with your email and password.')) + '</p>' +
      (up ? '<label>' + T('الاسم', 'Name') + '</label><input name="name" autocomplete="name">' : '') +
      '<label>' + T('البريد الإلكتروني', 'Email') + '</label><input name="email" type="email" dir="ltr" required autocomplete="username">' +
      '<label>' + T('كلمة المرور', 'Password') + (up ? T(' (6 أحرف على الأقل)', ' (at least 6 characters)') : '') + '</label><input name="password" type="password" dir="ltr" required minlength="6" autocomplete="' + (up ? 'new-password' : 'current-password') + '">' +
      '<button class="go" type="submit">' + (up ? T('إنشاء الحساب والدخول', 'Create account & sign in') : T('دخول', 'Sign in')) + '</button>' +
      '<div class="msg' + (ok ? ' ok' : '') + '">' + esc(msg || '') + '</div>' +
      '<div class="alt">' + (up ? '<a data-m="in">' + T('لدي حساب، تسجيل الدخول', 'I have an account, sign in') + '</a>' : '<a data-m="up">' + T('أول مرة؟ أنشئ حسابك', 'First time? Create your account') + '</a>') + '</div></form>';
    el.querySelector('[data-l]').onclick = function () { try { localStorage.setItem('sak-lang', en() ? 'ar' : 'en'); } catch (e) { /* ignore */ } document.documentElement.lang = en() ? 'ar' : 'en'; screen(); };
    var a = el.querySelector('[data-m]'); a.onclick = function () { mode = a.getAttribute('data-m'); screen(); };
    var f = el.querySelector('form');
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var email = f.email.value.trim().toLowerCase(), pw = f.password.value, btn = f.querySelector('.go');
      btn.disabled = true; f.querySelector('.msg').textContent = '';
      var p = up
        ? fetch(SB_URL + '/functions/v1/sak-signup', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY }, body: JSON.stringify({ email: email, password: pw, name: f.name.value }) })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'failed'); }); })
          .then(function () { return sb.auth.signInWithPassword({ email: email, password: pw }); })
        : sb.auth.signInWithPassword({ email: email, password: pw });
      p.then(function (r) { if (r && r.error) throw r.error; }).catch(function (e) {
        var m = String((e && e.message) || '');
        btn.disabled = false;
        screen(/not_allowed/.test(m) ? T('هذا البريد غير مضاف للنظام. اطلب من مدير النظام إضافته.', 'This email is not on the access list. Ask the system owner to add it.')
          : /exists/.test(m) ? T('هذا البريد لديه حساب بالفعل. سجّل الدخول.', 'This email already has an account. Sign in.')
          : /invalid/i.test(m) ? T('البريد أو كلمة المرور غير صحيحة.', 'Wrong email or password.')
          : T('تعذّر الاتصال. حاول مرة أخرى.', 'Could not connect. Try again.'));
        if (/exists/.test(m)) { mode = 'in'; }
        var nf = document.querySelector('#sak-login form'); if (nf) nf.email.value = email;
      });
    };
  }

  var entered = false;
  function enter(s) {
    if (entered) return; entered = true;
    session = s;
    sb.from('app_users').select('email,is_owner,name').eq('email', s.user.email.toLowerCase()).maybeSingle().then(function (r) {
      if (!r.data) { entered = false; session = null; sb.auth.signOut(); mode = 'in'; screen(T('هذا الحساب لم يعد مسموحاً له بالدخول.', 'This account no longer has access.')); return; }
      me = r.data;
      var el = document.getElementById('sak-login'); if (el) el.remove();
      addSignOut();
      readyResolve();
    });
  }

  function addSignOut() {
    var foot = document.querySelector('.side-foot');
    if (!foot || document.getElementById('sak-out')) return;
    var b = document.createElement('button'); b.id = 'sak-out'; b.type = 'button'; b.className = 'flat sak-out';
    b.innerHTML = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3M13 14l4-4-4-4M17 10H8"/></svg><span></span>';
    b.onclick = function () { user.signOut(); };
    foot.insertBefore(b, foot.querySelector('.me'));
    var lbl = function () { b.querySelector('span').textContent = document.documentElement.lang === 'en' ? 'Sign out' : 'تسجيل الخروج'; };
    lbl(); new MutationObserver(lbl).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  }

  /* ---------- access list on the Users page ---------- */
  function drawAccess(box) {
    if (box.getAttribute('data-on')) return; box.setAttribute('data-on', '1');
    function paint(list, msg) {
      var owner = me && me.is_owner;
      box.innerHTML = (owner ? '<p class="muted small">' + T('أضف بريد الشخص هنا، ثم يفتح رابط النظام ويختار «أول مرة؟ أنشئ حسابك» ويضع كلمة مروره. بعد دخوله حدد دوره في الجدول أعلاه.', 'Add the person\'s email here. They open the system link, choose "First time? Create your account" and set their password. Once they sign in, set their role in the table above.') + '</p>' +
        '<div class="row"><input id="sak-new" type="email" dir="ltr" placeholder="name@company.com"><button class="btn primary" type="button" id="sak-add">' + T('إضافة', 'Add') + '</button></div>' : '') +
        '<ul>' + list.map(function (u) { return '<li><span class="ltr">' + esc(u.email) + (u.is_owner ? ' <span class="tag">' + T('المالك', 'owner') + '</span>' : '') + '</span>' + (owner && !u.is_owner ? '<button class="btn sm" type="button" data-rm="' + esc(u.email) + '">' + T('إزالة', 'Remove') + '</button>' : '') + '</li>'; }).join('') + '</ul>' +
        (msg ? '<p class="small" style="margin-top:8px">' + esc(msg) + '</p>' : '');
      var add = box.querySelector('#sak-add');
      if (add) add.onclick = function () {
        var e = box.querySelector('#sak-new').value.trim().toLowerCase();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { paint(list, T('اكتب بريداً صحيحاً.', 'Enter a valid email.')); return; }
        sb.from('app_users').insert({ email: e }).then(function (r) { refresh(r.error ? T('لم تتم الإضافة (ربما البريد مضاف مسبقاً).', 'Not added (it may already be on the list).') : T('أُضيف ', 'Added ') + e); });
      };
      box.querySelectorAll('[data-rm]').forEach(function (b) {
        b.onclick = function () { var e = b.getAttribute('data-rm'); sb.from('app_users').delete().eq('email', e).then(function (r) { refresh(r.error ? T('تعذّرت الإزالة.', 'Could not remove.') : T('أُزيل ', 'Removed ') + e); }); };
      });
    }
    function refresh(msg) { sb.from('app_users').select('email,is_owner').order('added_at').then(function (r) { paint(r.data || [], msg); }); }
    refresh();
  }
  /* ---------- backup & restore (Setup → Update data) ---------- */
  function stamp(d) { var p = function (n) { return (n < 10 ? '0' : '') + n; }; d = d || new Date(); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()); }
  function fmt(iso) { var d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(en() ? 'en-GB' : 'ar-SA-u-nu-latn', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); }
  var KIND = { auto: ['تلقائية', 'automatic'], 'before-restore': ['قبل الاسترجاع', 'before restore'] };
  function drawBackup(box) {
    if (box.getAttribute('data-on')) return; box.setAttribute('data-on', '1');
    var owner = me && me.is_owner, msg = '', list = [], armed = null;
    function paint() {
      box.innerHTML = '<p class="muted small" style="margin-top:0">' + T('تُحفظ نسخة تلقائية من كل البيانات يومياً الساعة 3 فجراً، ويُحتفظ بآخر 30 نسخة. وتستطيع تنزيل نسخة كاملة الآن واحفظها في مجلد المشروع.', 'A full automatic copy is saved every day at 3 AM and the last 30 are kept. You can also download a full copy now and keep it in your project folder.') + '</p>' +
        '<div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn primary" type="button" data-b="dl">' + T('تنزيل نسخة احتياطية الآن', 'Download backup now') + '</button>' +
        (owner ? '<label class="btn" style="cursor:pointer">' + T('استرجاع من ملف…', 'Restore from file…') + '<input type="file" accept=".json,application/json" data-b="file" hidden></label>' : '') + '</div>' +
        (owner && list.length ? '<div class="scroll"><table><thead><tr><th>' + T('النسخة', 'Copy') + '</th><th>' + T('النوع', 'Type') + '</th><th>' + T('السجلات', 'Records') + '</th><th></th></tr></thead><tbody>' +
          list.map(function (b) { var k = KIND[b.kind] || [b.kind, b.kind]; return '<tr><td class="num">' + esc(fmt(b.taken_at)) + '</td><td>' + esc(T(k[0], k[1])) + '</td><td class="num">' + b.doc_count + '</td><td><button class="btn sm" type="button" data-b="rs" data-id="' + b.id + '">' + (armed === 's' + b.id ? T('تأكيد الاسترجاع', 'Confirm restore') : T('استرجاع', 'Restore')) + '</button></td></tr>'; }).join('') +
          '</tbody></table></div>' : '') +
        (owner ? '<p class="muted small">' + T('الاسترجاع يستبدل كل البيانات الحالية بالنسخة المختارة، ويحفظ نسخة من الوضع الحالي قبلها حتى تستطيع التراجع.', 'Restoring replaces all current data with the chosen copy, and saves a copy of the current state first so you can undo it.') + '</p>' : '') +
        (msg ? '<p class="small"><b>' + esc(msg) + '</b></p>' : '');
      box.querySelector('[data-b=dl]').onclick = function () {
        msg = T('جارٍ التحضير…', 'Preparing…'); paint();
        sb.rpc('sak_export').then(function (r) {
          if (r.error) { msg = T('تعذّر التنزيل: النسخ الاحتياطي للأدمن فقط.', 'Could not download: backups are for admins only.'); paint(); return; }
          downloads.save({ filename: 'SAK-backup-' + stamp() + '.json', data: JSON.stringify(r.data, null, 1), mimeType: 'application/json' });
          msg = T('نُزّلت نسخة فيها ', 'Downloaded a copy with ') + r.data.docs.length + T(' سجلاً.', ' records.'); paint();
        });
      };
      var f = box.querySelector('[data-b=file]');
      if (f) f.onchange = function () {
        var file = f.files && f.files[0]; if (!file) return;
        file.text().then(function (t) {
          var j; try { j = JSON.parse(t); } catch (e) { j = null; }
          if (!j || j.system !== 'SAK Purchasing' || !Array.isArray(j.docs)) { msg = T('هذا الملف ليس نسخة احتياطية من النظام.', 'This file is not a backup from this system.'); paint(); return; }
          armed = { file: j };
          msg = T('الملف بتاريخ ', 'File from ') + fmt(j.exported_at) + T(' وفيه ', ' with ') + j.docs.length + T(' سجلاً. اضغط «تأكيد الاسترجاع من الملف» للمتابعة.', ' records. Press "Confirm restore from file" to continue.');
          paint();
          var c = document.createElement('button'); c.className = 'btn primary'; c.type = 'button'; c.textContent = T('تأكيد الاسترجاع من الملف', 'Confirm restore from file');
          c.onclick = function () { restore(sb.rpc('sak_restore', { payload: armed.file })); };
          box.querySelector('.row').appendChild(c);
        });
      };
      box.querySelectorAll('[data-b=rs]').forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-id');
          if (armed !== 's' + id) { armed = 's' + id; msg = ''; paint(); return; }
          restore(sb.rpc('sak_restore_snapshot', { bid: +id }));
        };
      });
    }
    function restore(p) {
      armed = null; msg = T('جارٍ الاسترجاع…', 'Restoring…'); paint();
      p.then(function (r) {
        if (r.error) { msg = T('تعذّر الاسترجاع.', 'Restore failed.') + ' ' + (r.error.message || ''); paint(); return; }
        msg = T('تم الاسترجاع (', 'Restored (') + r.data + T(' سجلاً). سيُعاد تحميل الصفحة.', ' records). Reloading the page.'); paint();
        setTimeout(function () { location.reload(); }, 1500);
      });
    }
    function refresh() { if (!owner) { paint(); return; } sb.rpc('sak_backup_list').then(function (r) { list = r.data || []; paint(); }); }
    refresh();
  }

  new MutationObserver(function () {
    var b = document.getElementById('sak-access'); if (b) drawAccess(b);
    var k = document.getElementById('sak-backup'); if (k) drawBackup(k);
  }).observe(document.documentElement, { childList: true, subtree: true });

  /* ---------- start ---------- */
  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) enter(r.data.session); else screen();
  });
  sb.auth.onAuthStateChange(function (ev, s) { if (ev === 'SIGNED_IN' && s) setTimeout(function () { enter(s); }, 0); });
})();
</script>

<script>
/* SAK planning + landed cost engine. Pure functions, no DOM. */
(function (root) {
  'use strict';
  var EPS = 1e-6;
  function N(v) { return typeof v === 'number' && isFinite(v) ? v : 0; }
  function round(x, d) { var p = Math.pow(10, d); return Math.round(x * p) / p; }
  function ceilTo(x, s) { if (!(s > 0)) return 0; return Math.ceil(x / s - 1e-9) * s; }
  function floorTo(x, s) { if (!(s > 0)) return 0; return Math.floor(x / s + 1e-9) * s; }
  function dayNum(iso) {
    if (!iso) return null;
    var m = /^(\d{4})-(\d\d)-(\d\d)/.exec(String(iso));
    if (!m) return null;
    return Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000);
  }
  function dayIso(n) {
    if (n === null || n === undefined || n === '') return '';
    return new Date(Math.floor(n) * 86400000).toISOString().slice(0, 10);
  }
  function supplierOf(s) {
    var g = s.group !== undefined && s.group !== null && String(s.group) !== '' ? s.group : (s.brand || '');
    return String(g).trim().replace(/\s+/g, ' ');
  }

  var STATUSES = ['CRITICAL', 'URGENT', 'ORDER NEXT', 'RECEIVE INBOUND / MONITOR', 'DO NOT ORDER',
    'HOLD (Mgmt Review)', 'REDUCE / SALES PUSH', 'NO SALES / REVIEW'];

  /* skus: [{code,brand,group,moq,stock,lt,avg,cap20,cap40,inbound:[{qty,eta}],override,approved,stockMissing}]
     st: {date,safety,overAdd,hold,reduce,critical,window,minCover,maxCover,allowAbove,ceiling}
     ctrOverride: {supplier: '20ft'|'40ft'|'Both'} */
  function computePlan(skus, st, ctrOverride) {
    ctrOverride = ctrOverride || {};
    var D0 = dayNum(st.date);
    var allowAbove = st.allowAbove === true || st.allowAbove === 'Yes';
    // Timing check (added 2026-11-15, not in the workbook): the plan above adds ALL inbound to stock regardless of ETA.
    // For items the plan does not order, project stock day by day to when an order placed today would arrive
    // (today + lead time) and on through the cover target. If stock falls below safety stock in that window,
    // flag it and suggest the quantity that keeps it at safety. Only adds fields (t*); Excel columns are unchanged.
    // Run-out check (added 2026-11-15): for every item with sales, will stock hit zero before an order placed
    // today could arrive? If so, ordering cannot prevent it – only expediting, local buying or moving stock can.
    // rOut = run-out day, rNext = first inbound after that day (null if none), rGap = days without stock until rNext
    // (or until an order placed today arrives, if no inbound comes first).
    function runout(r) {
      r.rOut = null; r.rNext = null; r.rGap = 0; r.rNextNo = ''; r.rNextStatus = '';
      if (!(r.H > 0)) return;
      var perDay = r.H / 30, arrive = D0 + Math.round(r.G * 30), level = r.F, day = D0, out = null;
      var ev = r.inb.filter(function (x) { return x.eta !== null && x.qty > 0; })
        .map(function (x) { return { day: Math.max(x.eta, D0), qty: x.qty, no: x.no, status: x.status }; })
        .sort(function (a, b) { return a.day - b.day; });
      if (level <= 0 && !(ev.length && ev[0].day === D0)) out = D0;
      for (var i = 0; out === null && i < ev.length && ev[i].day <= arrive; i++) {
        var next = level - perDay * (ev[i].day - day);
        if (next < 0) { out = day + Math.max(0, level) / perDay; break; }
        level = next + ev[i].qty; day = ev[i].day;
      }
      if (out === null && level - perDay * (arrive - day) < 0) out = day + Math.max(0, level) / perDay;
      if (out === null || out >= arrive) return;
      r.rOut = Math.floor(out);
      for (var k = 0; k < ev.length; k++) if (ev[k].day > out) { r.rNext = ev[k].day; r.rNextNo = ev[k].no || ''; r.rNextStatus = ev[k].status || ''; break; }
      r.rGap = Math.max(0, Math.round((r.rNext !== null ? Math.min(r.rNext, arrive) : arrive) - out));
    }
    function timing(r) {
      r.tAlert = false; r.tQty = 0; r.tQtyMoq = 0; r.tAtArrival = null; r.tStockout = null; r.tArrive = null; r.tShort = 0;
      if (!(r.H > 0) || r.CE > 0) return;
      var perDay = r.H / 30, arrive = D0 + Math.round(r.G * 30), safety = r.H * st.safety;
      var ev = r.inb.filter(function (x) { return x.eta !== null && x.qty > 0; })
        .map(function (x) { return { day: Math.max(x.eta, D0), qty: x.qty }; })
        .sort(function (a, b) { return a.day - b.day; });
      var level = r.F, day = D0, stockout = null, i = 0;
      function runTo(t) { var next = level - perDay * (t - day); if (stockout === null && next < 0) stockout = day + Math.max(0, level) / perDay; level = next; day = t; }
      for (; i < ev.length && ev[i].day <= arrive; i++) { runTo(ev[i].day); level += ev[i].qty; }
      runTo(arrive);
      r.tArrive = arrive; r.tAtArrival = level; r.tStockout = stockout === null ? null : Math.floor(stockout);
      if (level >= safety - EPS) return;
      // after arrival: stock starts from max(0, level); find the largest shortfall below safety until the cover horizon
      var horizon = arrive + Math.round(r.AH * 30), lv = Math.max(0, level), d = arrive, short = 0;
      function check(t) { lv -= perDay * (t - d); d = t; if (safety - lv > short) short = safety - lv; }
      for (; i < ev.length && ev[i].day <= horizon; i++) { check(ev[i].day); lv += ev[i].qty; }
      check(horizon);
      r.tAlert = true; r.tShort = short;
      // exact cartons needed (no MOQ rounding: adding to an existing PO is often possible below MOQ); MOQ-rounded kept for reference
      r.tQty = short > EPS ? Math.ceil(round(short, 6) - 1e-9) : 0;
      r.tQtyMoq = short > EPS && r.E > 0 ? ceilTo(round(short, 6), r.E) : r.tQty;
    }
    var rows = skus.map(function (s) {
      var r = { sku: s, code: s.code, sup: supplierOf(s) };
      r.E = N(s.moq); r.F = N(s.stock); r.G = N(s.lt); r.H = N(s.avg); r.I = N(s.cap20); r.J = N(s.cap40);
      var inb = (s.inbound || []).map(function (x) { return { qty: N(x.qty), eta: dayNum(x.eta), no: x.no, status: x.status }; });
      r.inb = inb;
      function within(d) {
        var t = 0;
        inb.forEach(function (x) { if (x.eta !== null && x.eta >= D0 && x.eta - D0 <= d) t += x.qty; });
        return t;
      }
      r.R = r.G + st.safety;
      r.S = r.H * r.R;
      r.T = r.H > 0 ? r.F / r.H : null;
      r.U = r.H > 0 ? r.F / (r.H / 30) : null;
      r.V = within(30); r.W = within(st.window); r.X = within(90); r.in60 = within(60);
      r.Y = inb.reduce(function (a, x) { return a + x.qty; }, 0);
      var z = null;
      inb.forEach(function (x) { if (x.qty > 0 && x.eta !== null && x.eta >= D0 && (z === null || x.eta < z)) z = x.eta; });
      r.Z = z;
      r.AA = z === null ? null : z - D0;
      r.AB = (r.AA === null || r.H === 0) ? null : r.U - r.AA;
      r.AC = r.H * 3;
      r.AD = r.F + r.X;
      r.AE = r.H > 0 ? (r.F + r.Y) / r.H : null;
      var pos = r.F + r.Y;
      r.pos = pos;
      r.AF = r.H > 0 ? (r.S - pos > 0 ? ceilTo(r.S - pos, r.E) : 0) : 0;
      if (r.H === 0) r.AG = 'NO SALES / REVIEW';
      else if ((r.T < st.critical && r.W === 0) || (r.AB !== null && r.AB < 0)) r.AG = 'CRITICAL';
      else if (r.AD < r.AC || r.AE < r.G) r.AG = 'URGENT';
      else if (r.T < r.G && r.W > 0 && r.AB !== null && r.AB >= 0 && r.AE >= r.R) r.AG = 'RECEIVE INBOUND / MONITOR';
      else if (r.AE < r.R && r.AF > 0) r.AG = 'ORDER NEXT';
      else if (r.AE > st.reduce) r.AG = 'REDUCE / SALES PUSH';
      else if (r.AE > Math.max(r.R + st.overAdd, st.hold)) r.AG = 'HOLD (Mgmt Review)';
      else r.AG = 'DO NOT ORDER';
      r.AH = Math.min(Math.max(st.minCover, r.R), st.maxCover);
      function gapTo(cover, fn) {
        if (!(r.H > 0)) return 0;
        var g = r.H * cover - pos;
        return g > 0 ? fn(round(g, 6), r.E) : 0;
      }
      r.AI = gapTo(r.AH, ceilTo);
      r.AJ = gapTo(st.maxCover, floorTo);
      r.AK = gapTo(st.ceiling, floorTo);
      return r;
    });

    var groups = {}, order = [];
    rows.forEach(function (r) {
      if (!groups[r.sup]) { groups[r.sup] = []; order.push(r.sup); }
      groups[r.sup].push(r);
    });
    function sum(list, f) { var t = 0; list.forEach(function (r) { t += f(r); }); return t; }

    order.forEach(function (name) {
      var g = groups[name];
      var ships = sum(g, function (r) { return r.AF; }) > 0 ? 1 : 0;
      g.forEach(function (r) {
        r.AL = ships;
        if (ships === 0 || r.H === 0) r.AM = 0;
        else if (r.AF > 0) r.AM = ((r.pos + r.AI) / r.H <= st.maxCover + EPS) ? r.AI : Math.max(r.AF, r.AJ);
        else r.AM = r.AI === 0 ? 0 : (((r.pos + r.AI) / r.H <= st.maxCover + EPS) ? r.AI : 0);
        r.AN = ships === 0 ? 0 : Math.max(r.AM, r.AJ);
      });
      var type = '';
      if (ships) {
        if (ctrOverride[name]) type = ctrOverride[name];
        else {
          var can = g.filter(function (r) { return r.AN > 0; });
          if (can.length) {
            var n20 = can.filter(function (r) { return r.I > 0; }).length;
            var n40 = can.filter(function (r) { return r.J > 0; }).length;
            if (n20 === can.length && n40 === can.length) type = 'Both';
            else if (n20 === can.length) type = '20ft';
            else if (n40 === can.length) type = '40ft';
            else type = sum(g.filter(function (r) { return r.I > 0; }), function (r) { return r.AM; }) >=
              sum(g.filter(function (r) { return r.J > 0; }), function (r) { return r.AM; }) ? '20ft' : '40ft';
          }
        }
      }
      var big = type === '40ft' || type === 'Both';
      g.forEach(function (r) {
        r.AO = type;
        r.AP = big ? (r.J > 0 ? r.J : (r.I > 0 ? r.I * 2 : 0)) : (r.I > 0 ? r.I : (r.J > 0 ? r.J / 2 : 0));
      });
      var withCap = g.filter(function (r) { return r.AP > 0; });
      var avgCap = withCap.length ? sum(withCap, function (r) { return r.AP; }) / withCap.length : 1000;
      g.forEach(function (r) {
        r.AQ = r.AP > 0 ? r.AP : avgCap;
        r.AR = r.AM / r.AQ;
        r.AS = (r.AN - r.AM) / r.AQ;
      });
      var AT = sum(g, function (r) { return r.AR; });
      var AU = sum(g, function (r) { return r.AS; });
      var AV = AT > EPS ? ceilTo(round(AT, 4), type === 'Both' ? 0.5 : 1) : 0;
      var AW = AU > EPS ? Math.min(1, (AV - AT) / AU) : 0;
      g.forEach(function (r) {
        r.AT = AT; r.AU = AU; r.AV = AV; r.AW = AW;
        r.q = r.H === 0 ? 0 : r.AM + (r.AN > r.AM ? floorTo(round(AW * (r.AN - r.AM), 6), r.E) : 0);
        r.AX = r.q;
      });
      // five top-up passes: 1-2 within MAX cover, 3-5 up to the absolute ceiling
      for (var p = 1; p <= 5; p++) {
        var above = p >= 3;
        var gap = AV === 0 ? 0 : AV - sum(g, function (r) { return r.q / r.AQ; });
        var best = null;
        g.forEach(function (r) {
          var lim = above ? Math.max(r.AN, r.AK) : r.AN;
          r._lim = lim;
          r._el = (!above || allowAbove) && r.AL === 1 && AV > 0 && r.H > 0 && r.E / r.AQ <= gap + EPS && r.q + r.E <= lim;
          if (r._el && (best === null || r.H > best.H)) best = r;
        });
        if (best) best.q = best.q + Math.min(floorTo(round(gap * best.AQ, 6), best.E), best._lim - best.q);
      }
      g.forEach(function (r) { r.CD = r.q; });
    });

    rows.forEach(function (r) {
      var s = r.sku;
      var hasOv = s.override !== undefined && s.override !== null && s.override !== '';
      r.hasOverride = hasOv;
      r.CE = hasOv ? N(s.override) : r.CD;
      // a manual quantity may not push cover above the absolute ceiling (unless the plan itself already does)
      r.overrideCapped = null;
      if (hasOv && r.H > 0 && r.CE > Math.max(r.AK, r.CD)) { r.overrideCapped = r.CE; r.CE = Math.max(r.AK, r.CD); }
      r.CF = r.H > 0 ? (r.pos + r.CE) / r.H : null;
      r.CG = r.CE / r.AQ;
      if (r.H === 0) r.CH = 'No sales history';
      else if (r.CE === 0) {
        r.CH = r.CF > st.maxCover + EPS ? 'Above MAX – overstock, no order'
          : (r.CF < r.AH - EPS ? (r.AL === 1 ? 'Below MIN – 1 MOQ would exceed MAX' : 'Below MIN – supplier not due (see Next PO)')
            : 'OK – no order needed');
      } else {
        r.CH = r.CF > st.maxCover + EPS ? (r.CE > r.AN ? 'Above MAX – container top-up' : 'Above MAX – MOQ / rule forced')
          : (r.CF < r.AH - EPS ? 'Below MIN – MOQ step' : 'OK');
      }
      if (r.CE > 0) {
        r.CI = D0 + r.G * 30;
        var arr = 0;
        r.inb.forEach(function (x) { if (x.eta !== null && x.eta <= r.CI) arr += x.qty; });
        r.CJ = r.F + arr - r.H * r.G;
        r.CK = r.H > 0 ? (Math.max(0, r.CJ) + r.CE) / r.H : null;
        r.CL = r.CJ < 0 ? 'Stock-out ~' + Math.round(-r.CJ / r.H * 30) + ' days before PO arrives – expedite / allocate'
          : 'OK – stock lasts until PO arrives';
        r.stockOutDays = r.CJ < 0 ? Math.round(-r.CJ / r.H * 30) : 0;
      } else { r.CI = null; r.CJ = null; r.CK = null; r.CL = ''; r.stockOutDays = 0; }
      r.CM = r.F + r.V - r.H;
      r.CN = r.F + r.in60 - r.H * 2;
      r.CO = r.F + r.X - r.H * 3;
      if (r.H > 0 && r.CE === 0) {
        r.CP = D0 + Math.max(0, r.AE - r.R) * 30;
        var nq = r.H * (st.maxCover - r.R);
